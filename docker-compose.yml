version: '3.8'

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: batch_user
      POSTGRES_PASSWORD: batch_password
      POSTGRES_DB: batch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  response-service:
    build: ../response-service
    ports:
      - "8081:8081"

volumes:
  postgres_data: