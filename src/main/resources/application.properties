spring.application.name=batch-service
server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/batch_db
spring.datasource.username=${POSTGRES_USER:batch_user}
spring.datasource.password=${POSTGRES_PASSWORD:batch_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.contexts=dev

response.service.url=http://response-service:8081/api/v1

archive.processing.request-interval-sec=30
archive.processing.portion-size=100
archive.processing.portion-interval-ms=1000
archive.processing.initial-delay-ms=0
archive.processing.repeat-error-request-ms=800
archive.processing.try-count=3